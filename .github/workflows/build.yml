name: Build BJLO Browser

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write      # necesario para adjuntar el APK a un Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK (debug y release)
        run: ./gradlew assembleDebug assembleRelease

      - name: Renombrar APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BJLO-Browser-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/BJLO-Browser-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BJLO-Browser-apk
          path: dist/*.apk

      # Al subir una etiqueta (git tag v1.0.0), publica un Release con el APK descargable
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BJLO Browser ${{ github.ref_name }}
          files: dist/BJLO-Browser-release.apk
