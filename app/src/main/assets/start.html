<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BJLO Browser</title>
<style>
  html,body{height:100%;margin:0;background:#0A0A0C;color:#E8EAED;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:min(52vw,360px);height:auto;margin-bottom:28px}
  h1{font-size:clamp(18px,3.2vw,28px);font-weight:600;margin:0 0 8px}
  p{color:#8A8F98;font-size:clamp(14px,2.2vw,19px);margin:0 0 30px;max-width:640px;line-height:1.5}
  .links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  a{color:#fff;text-decoration:none;border:2px solid #0071E3;border-radius:999px;padding:12px 26px;font-size:clamp(14px,2.2vw,18px);background:#121218}
  a:hover,a:focus{background:#0071E3;outline:none}
</style>
</head>
<body>
  <img src="file:///android_res/drawable/bjlo_logo.png" alt="BJLO">
  <h1>¿Qué quieres abrir?</h1>
  <p>Escribe un código de AFTVnews, una dirección web o una búsqueda en la barra superior.</p>
  <div class="links">
    <a href="https://www.google.com">Google</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://aftvnews.com">AFTVnews</a>
  </div>
</body>
</html>
